name: APK Android ARM64

on:
  push:
    branches: [main, principal]
    paths:
      - "android/**"
      - "majeirkn/ui/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:
    inputs:
      runtime_url:
        description: "URL direta do .tar.gz do runtime Snapdragon ARM64"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar e preparar runtime
        env:
          INPUT_RUNTIME_URL: ${{ github.event.inputs.runtime_url }}
          SECRET_RUNTIME_URL: ${{ secrets.MAJEIRKN_RUNTIME_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME_URL="${INPUT_RUNTIME_URL:-}"
          if [[ -z "$RUNTIME_URL" ]]; then RUNTIME_URL="${SECRET_RUNTIME_URL:-}"; fi
          if [[ -z "$RUNTIME_URL" ]]; then
            echo "::error::Informe a URL direta do runtime no campo runtime_url ou configure MAJEIRKN_RUNTIME_URL."
            exit 1
          fi

          curl --fail --location --retry 3 --retry-delay 2 "$RUNTIME_URL" -o "$RUNNER_TEMP/llama-runtime.tar.gz"
          mkdir -p "$RUNNER_TEMP/runtime-unpacked"
          tar -xzf "$RUNNER_TEMP/llama-runtime.tar.gz" -C "$RUNNER_TEMP/runtime-unpacked"

          ROOT="$RUNNER_TEMP/runtime-unpacked/llama.cpp"
          SERVER="$ROOT/bin/libllama-server.so"
          LIBDIR="$ROOT/lib"
          if [[ ! -s "$SERVER" || ! -d "$LIBDIR" ]]; then
            echo "::error::Runtime invalido. Esperado llama.cpp/bin/libllama-server.so e llama.cpp/lib/*.so."
            find "$RUNNER_TEMP/runtime-unpacked" -maxdepth 4 -type f -print
            exit 1
          fi

          ASSETS="android/app/src/main/assets/arm64-v8a"
          JNI="android/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$ASSETS" "$JNI"
          mkdir -p "$ASSETS" "$JNI"
          find "$LIBDIR" -maxdepth 1 -type f -name '*.so' -exec cp -L {} "$ASSETS/" \;
          install -m 0755 "$SERVER" "$JNI/libllama-server.so"

          REQUIRED_LIBS=(
            libllama-server-impl.so
            libllama-common.so
            libmtmd.so
            libllama.so
            libggml.so
            libggml-cpu.so
            libggml-opencl.so
            libggml-hexagon.so
            libggml-base.so
          )
          for lib in "${REQUIRED_LIBS[@]}"; do
            test -s "$ASSETS/$lib" || { echo "::error::Biblioteca ausente: $lib"; exit 1; }
          done

      - name: Validar arquitetura ARM64
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils file
          ASSETS="android/app/src/main/assets/arm64-v8a"
          SERVER="android/app/src/main/jniLibs/arm64-v8a/libllama-server.so"
          file "$SERVER"
          readelf -h "$SERVER" | grep -q 'Machine:.*AArch64' || { echo "::error::Servidor nao e AArch64."; exit 1; }

          REQUIRED_LIBS=(
            libllama-server-impl.so
            libllama-common.so
            libmtmd.so
            libllama.so
            libggml.so
            libggml-cpu.so
            libggml-opencl.so
            libggml-hexagon.so
            libggml-base.so
          )
          for lib in "${REQUIRED_LIBS[@]}"; do
            file "$ASSETS/$lib"
            readelf -h "$ASSETS/$lib" | grep -q 'Machine:.*AArch64' || { echo "::error::$lib nao e ELF ARM64."; exit 1; }
          done
          echo "Bibliotecas AArch64 validadas. Os arquivos libggml-htp-v*.so sao blobs Qualcomm DSP6 e nao ELF ARM64."

      - name: Copiar interface web e licencas
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p android/app/src/main/assets/webui android/app/src/main/assets/licenses
          cp -a majeirkn/ui/. android/app/src/main/assets/webui/
          cp LICENSE android/app/src/main/assets/licenses/majeirkn-MIT.txt
          curl --fail --location https://raw.githubusercontent.com/ggml-org/llama.cpp/master/LICENSE -o android/app/src/main/assets/licenses/llama.cpp-MIT.txt

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de depuracao
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: majeirkn-apk-arm64
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
