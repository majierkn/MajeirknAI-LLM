name: APK

# Builda o APK a cada alteracao no projeto Android (e sob demanda).
# Repositorios privados tem minutos gratuitos suficientes para isso.
on:
  push:
    branches: [main, principal]
    paths:
      - "android/**"
      - "majeirkn/ui/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------ binarios
      # O CI nao compila o llama.cpp: usa o pacote de runtime publicado como
      # release (scripts/pack_runtime.sh). Configure o segredo do repositorio.
      - name: Baixar o runtime do llama.cpp
        env:
          RUNTIME_URL: ${{ secrets.MAJEIRKN_RUNTIME_URL }}
        run: |
          if [ -z "$RUNTIME_URL" ]; then
            echo "::error::Defina o segredo MAJEIRKN_RUNTIME_URL com o link do tarball de runtime."
            exit 1
          fi
          curl -fsSL "$RUNTIME_URL" -o runtime.tar.gz
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf runtime.tar.gz -C "$RUNNER_TEMP" --strip-components=1 runtime/bin
          rm -rf android/app/src/main/assets/arm64-v8a
          mkdir -p android/app/src/main/assets/arm64-v8a
          find "$RUNNER_TEMP/bin" -maxdepth 1 -type f -exec cp -L {} android/app/src/main/assets/arm64-v8a/ \;
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          install -m 0755 android/app/src/main/assets/arm64-v8a/llama-server android/app/src/main/jniLibs/arm64-v8a/libllama-server.so
          echo "llama-server empacotado como biblioteca nativa extraida pelo Android"

      - name: Verificar arquitetura do runtime Android
        # O runtime e compilado para Android ARM64. O runner do GitHub e Linux
        # x86_64, portanto nao devemos tentar executar o llama-server aqui.
        run: |
          cd android/app/src/main/assets/arm64-v8a

          sudo apt-get update
          sudo apt-get install -y binutils file

          echo "Verificando arquitetura do llama-server..."
          file ./llama-server
          readelf -h ./llama-server

          readelf -h ./llama-server | grep -q 'Machine:.*AArch64' || {
            echo "::error::llama-server nao e um binario ARM64 (AArch64)"
            exit 1
          }

          for lib in \
            libggml-base.so.0.28.0 \
            libggml-cpu.so.0.28.0 \
            libggml.so.0.28.0 \
            libllama-common.so.0.8.0 \
            libllama.so.0.8.0 \
            libmtmd.so.0.8.0 \
            libssl.so.3 \
            libcrypto.so.3 \
            libc++_shared.so \
            libllama-server-impl.so; do

            test -s "$lib" || {
              echo "::error::Biblioteca ausente ou vazia: $lib"
              exit 1
            }

            readelf -h "$lib" | grep -q 'Machine:.*AArch64' || {
              echo "::error::Biblioteca nao e ARM64: $lib"
              exit 1
            }
          done

          echo "Runtime Android ARM64 validado com sucesso!"


      # ------------------------------------------------------- interface web
      - name: Copiar a interface web
        run: |
          rm -rf android/app/src/main/assets/webui
          mkdir -p android/app/src/main/assets/webui
          cp -a majeirkn/ui/. android/app/src/main/assets/webui/

      - name: Copiar as licencas
        run: |
          mkdir -p android/app/src/main/assets/licenses
          cp -a LICENSE android/app/src/main/assets/licenses/majeirkn-MIT.txt
          curl -fsSL https://raw.githubusercontent.com/ggml-org/llama.cpp/master/LICENSE \
            -o android/app/src/main/assets/licenses/llama.cpp-MIT.txt || true

      # -------------------------------------------------------------- build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # assembleDebug ja vem assinado com a chave de depuracao: instalavel sem
      # configurar keystore. Para publicar na Play, use assembleRelease.
      - name: Build do APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: majeirkn-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
