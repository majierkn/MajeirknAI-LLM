<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Majeirkn AI</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header id="topbar">
    <button id="btn-menu" class="icon-btn" aria-label="Abrir conversas" title="Conversas">&#9776;</button>
    <div class="brand">Majeirkn<span class="accent">AI</span></div>
    <div id="status" class="status" data-state="loading">carregando&hellip;</div>
    <button id="btn-settings" class="icon-btn" aria-label="Ajustes" title="Ajustes">&#9881;</button>
    <button id="btn-new" class="icon-btn" aria-label="Nova conversa" title="Nova conversa">&#43;</button>
  </header>

  <aside id="drawer" class="panel" hidden>
    <div class="drawer-head">
      <span>Conversas</span>
      <button id="btn-close-drawer" class="icon-btn" aria-label="Fechar">&times;</button>
    </div>
    <ul id="conv-list" class="conv-list"></ul>
  </aside>

  <main id="chat" class="chat" aria-live="polite"></main>

  <div id="empty" class="empty">
    <img src="./icons/icon-192.png" alt="" width="72" height="72">
    <h1>Majeirkn AI</h1>
    <p>Assistente local, em portugu&ecirc;s do Brasil. Nada sai do seu aparelho.</p>
    <div class="suggestions">
      <button class="suggestion">Explique energia solar em 3 frases</button>
      <button class="suggestion">Escreva uma mensagem de parab&eacute;ns</button>
      <button class="suggestion">Como organizo meus estudos?</button>
    </div>
  </div>

  <footer id="composer">
    <textarea id="input" rows="1" placeholder="Escreva sua pergunta&hellip;"
              enterkeyhint="send" autocomplete="off"></textarea>
    <button id="btn-stop" class="send stop" hidden>Parar</button>
    <button id="btn-send" class="send">Enviar</button>
  </footer>

  <section id="settings" class="panel sheet" hidden>
    <div class="drawer-head">
      <span>Ajustes</span>
      <button id="btn-close-settings" class="icon-btn" aria-label="Fechar">&times;</button>
    </div>
    <label class="field">
      <span>Criatividade (temperature) <b id="val-temperature">0.70</b></span>
      <input id="opt-temperature" type="range" min="0.1" max="1.5" step="0.05" value="0.7">
    </label>
    <label class="field">
      <span>Amplitude (top_p) <b id="val-top_p">0.80</b></span>
      <input id="opt-top_p" type="range" min="0.1" max="1" step="0.05" value="0.8">
    </label>
    <label class="field">
      <span>Tamanho da resposta (max_tokens) <b id="val-max_tokens">512</b></span>
      <input id="opt-max_tokens" type="range" min="64" max="1024" step="32" value="512">
    </label>
    <p class="hint">Os ajustes valem para as proximas respostas e ficam salvos neste aparelho.</p>
    <div class="model-info" id="model-info"></div>
  </section>

  <div id="toast" class="toast" hidden></div>
  <script src="./app.js"></script>
</body>
</html>
